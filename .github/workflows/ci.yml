name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  satellite-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Satellite gates (manifest, trailers)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pip install -q pyyaml jsonschema
          python scripts/manifest/check_module_manifest.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            chmod +x scripts/provenance/check_range.sh
            ./scripts/provenance/check_range.sh "$BASE" "$HEAD"
          fi
