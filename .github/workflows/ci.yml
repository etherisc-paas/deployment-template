name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  satellite-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Satellite gates (manifest)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pip install -q pyyaml jsonschema
          python scripts/manifest/check_module_manifest.py

  commit-trailers:
    if: github.event_name == 'pull_request'
    uses: etherisc-paas/saas-architecture/.github/workflows/commit-trailers.yml@develop
    with:
      require_prefix: "no"

  gate:
    name: gate
    if: always()
    needs: [satellite-gates, commit-trailers]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
