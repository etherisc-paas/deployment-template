name: Commit trailers

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  trailers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Lint PR commit trailers (S0-T08)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/provenance/check_range.sh
          ./scripts/provenance/check_range.sh "$BASE" "$HEAD"

